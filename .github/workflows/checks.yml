name: checks

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  generator:
    name: Generator self-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r KnoxMap/requirements.txt

      - name: Python parses
        run: python -m compileall -q KnoxMap/app.py KnoxMap/knoxmap.py KnoxMap/knoxmap_cli.py KnoxMap/knoxmap_setup.py KnoxMap/knoxpaths.py KnoxMap/knoxlog.py KnoxMap/knoxstop.py KnoxMap/updater.py KnoxMap/generator KnoxMap/knoxbuild KnoxMap/tools KnoxMap/worlded tools

      - name: JavaScript parses
        run: |
          for f in KnoxMap/static/js/*.js; do
            node -e "new Function(require('fs').readFileSync('$f', 'utf8'))" && echo "ok $f"
          done
          for f in desktop/main.js desktop/build.mjs desktop/make-icons.mjs; do
            node --check "$f" && echo "ok $f"
          done

      - name: Whole pipeline on a made-up town (offline)
        run: python KnoxMap/tools/selftest.py

      - name: Floor plans (sealed rooms, stairs, roofs, lifts)
        run: python KnoxMap/tools/audit_layouts.py 200
