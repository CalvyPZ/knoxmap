name: worlded-linux

# A native Linux build of the patched map compiler, so Linux does not need
# Wine to make a map.
#
# Wine works, but it is a layer nobody can see into: WorldEd dies and there is
# nothing to read, its pipes are held open by wineserver long after it is
# gone, and paths have to be handed over as Z: names. Upstream publishes
# Windows binaries only, and its own BUILDING.md calls the Linux flow
# "intended" rather than tested - so this builds it, runs it, and packages it
# with the Qt libraries it needs, because none of that can be taken on trust.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish it as a release (tag below)'
        type: boolean
        default: false
      tag:
        description: 'Release tag'
        default: 'worlded-cli-linux-20260909f'
  push:
    paths:
      - 'KnoxMap/worlded/**'
      - '.github/workflows/worlded-linux.yml'

env:
  # The release knoxmap_setup.py pins, and the commit worlded/README.md names.
  COMMIT: 4e86b80c505b3d77a2fb5f5675b752da966306f6

jobs:
  build:
    name: Build PZWorldEd_cli for Linux
    # The oldest runner still offered: a binary built against a newer glibc
    # will not start on a distro older than the one that built it.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Qt 5.15 and a compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential patchelf \
            qtbase5-dev qtbase5-dev-tools qttools5-dev qttools5-dev-tools \
            libqt5svg5-dev libqt5opengl5-dev libqt5x11extras5-dev \
            zlib1g-dev
          qmake -v

      - name: PZ Mapping Tools at the pinned commit
        run: |
          git clone --quiet https://github.com/Unjammer/PZ_Mapping_Tools.git src
          git -C src checkout --quiet "$COMMIT"
          git -C src log --oneline -1

      - name: KnoxMap's headless patch
        run: python3 KnoxMap/worlded/patch_worlded_cli.py src

      - name: And what GCC will not build as it stands
        run: python3 KnoxMap/worlded/patch_worlded_linux.py src

      - name: Build
        run: |
          mkdir -p build
          cd build
          qmake "$GITHUB_WORKSPACE/src/WorldEd/PZWorldEd.pro" CONFIG+=release
          make -j"$(nproc)"

      - name: Find what was built
        id: built
        run: |
          exe=$(find build -type f -name PZWorldEd -perm -u+x | head -1)
          test -n "$exe" || { echo "no PZWorldEd came out of the build"; exit 1; }
          file "$exe"
          file "$exe" | grep -q 'ELF 64-bit.*executable' ||
            { echo "not a 64-bit Linux executable"; exit 1; }
          echo "exe=$exe" >> "$GITHUB_OUTPUT"

      - name: It carries the headless switch
        run: |
          strings "${{ steps.built.outputs.exe }}" | grep -q -- '--generate-map' ||
            { echo "the patch did not make it into the binary"; exit 1; }

      - name: Package it with its libraries
        run: |
          exe='${{ steps.built.outputs.exe }}'
          out=pack/PZWorldEd_cli-linux-x86_64
          mkdir -p "$out/lib" "$out/plugins/platforms"
          cp "$exe" "$out/PZWorldEd_cli"
          # WorldEd's own libraries first: libworlded, libtiled and the rest
          # come out of the build, not from anywhere on the system. Symlinks
          # and all - libzlib1.so.1.0.0 is the file, and libzlib1.so.1 is the
          # name the program asks for.
          find build -name '*.so*' -exec cp -av {} "$out/lib/" \;
          ls -l "$out/lib" | head -40
          # Headless: the compile draws nothing, so the offscreen plugin is
          # all Qt needs and no X libraries come into it.
          for plugin in libqoffscreen.so libqminimal.so; do
            found=$(find /usr/lib -name "$plugin" | head -1)
            [ -n "$found" ] && cp -Lv "$found" "$out/plugins/platforms/"
          done
          # Then everything any of that needs which is not the base system or
          # the machine's own graphics stack - Qt above all, so it runs on a
          # PC with no Qt installed. Three rounds, because a library copied in
          # brings its own.
          # glib and harfbuzz are left to the machine too: every desktop has
          # them, and a bundled copy older than the system GTK it ends up
          # beside fails on symbols GTK expects (g_dir_unref,
          # hb_ot_color_has_paint on Ubuntu 24.04).
          system='/(ld-linux[^/]*|libc|libm|libdl|libpthread|librt|libstdc\+\+|libgcc_s|libGL|libGLX|libGLdispatch|libEGL|libOpenGL|libX11|libxcb|libdrm|libgbm|libwayland-[a-z]+|libglib-2\.0|libgobject-2\.0|libgio-2\.0|libgmodule-2\.0|libharfbuzz)[.-]'
          for round in 1 2 3; do
            for f in "$out/PZWorldEd_cli" "$out"/lib/*.so* "$out"/plugins/platforms/*.so; do
              [ -e "$f" ] || continue
              LD_LIBRARY_PATH="$PWD/$out/lib" ldd "$f" 2>/dev/null |
                awk '/=> \//{print $3}' | grep -vE "$system"
            done | sort -u | while read -r lib; do
              [ -e "$out/lib/$(basename "$lib")" ] || cp -Lv "$lib" "$out/lib/"
            done
          done
          # Found beside the program rather than wherever a distro keeps it.
          # --force-rpath writes DT_RPATH, not DT_RUNPATH. The difference is
          # the whole problem on Linux: the loader searches DT_RPATH before
          # LD_LIBRARY_PATH and DT_RUNPATH after it, and Steam, Proton and
          # several desktops export an LD_LIBRARY_PATH with a system Qt on
          # it. With RUNPATH that Qt wins, and Qt aborts on the spot with
          # "Cannot mix incompatible Qt library". With RPATH nothing in the
          # environment can get in front of the Qt this ships with.
          patchelf --force-rpath --set-rpath '$ORIGIN/lib' "$out/PZWorldEd_cli"
          for lib in "$out"/lib/*.so*; do
            patchelf --force-rpath --set-rpath '$ORIGIN' "$lib"
          done
          for plugin in "$out"/plugins/platforms/*.so; do
            patchelf --force-rpath --set-rpath '$ORIGIN/../../lib' "$plugin"
          done
          # Qt looks for plugins under the prefix it was compiled with, which
          # is a system path on the machine that built it. qt.conf replaces
          # that prefix, and it is the first thing Qt reads: without it the
          # bundled Qt loads the system's imageformats plugins, and those
          # drag the system's Qt in behind them.
          printf '[Paths]\nPlugins=plugins\n' > "$out/qt.conf"
          du -sh "$out"

      - name: Nothing it needs is missing
        run: |
          out=pack/PZWorldEd_cli-linux-x86_64
          missing=$( { ldd "$out/PZWorldEd_cli"; ldd "$out"/plugins/platforms/*.so; } |
                     grep 'not found' || true)
          [ -z "$missing" ] || { echo "$missing"; exit 1; }
          echo "every library resolves"
          # And on RPATH, not RUNPATH, or an inherited LD_LIBRARY_PATH gets in
          # front of the bundled Qt and Qt aborts before WorldEd runs a line.
          for f in "$out/PZWorldEd_cli" "$out"/lib/*.so* "$out"/plugins/platforms/*.so; do
            [ -e "$f" ] && [ ! -L "$f" ] || continue
            if readelf -d "$f" | grep -q 'RUNPATH'; then
              echo "$f still records RUNPATH"; exit 1
            fi
          done
          echo "every binary records RPATH"
          # It has to still run with a hostile LD_LIBRARY_PATH in front of it.
          hostile=$(mktemp -d)
          cp "$out/lib/libQt5Core.so.5" "$hostile/" 2>/dev/null || true
          LD_LIBRARY_PATH="$hostile" QT_QPA_PLATFORM=offscreen \
            timeout 20 "$out/PZWorldEd_cli" --generate-map=/nope.pzw 2>&1 |
            tee run.log || true
          grep -q 'Cannot mix incompatible Qt' run.log &&
            { echo "the bundled Qt lost to LD_LIBRARY_PATH"; exit 1; }
          echo "it starts with a foreign Qt on LD_LIBRARY_PATH"

      - name: It runs
        run: |
          out=pack/PZWorldEd_cli-linux-x86_64
          export QT_QPA_PLATFORM=offscreen
          export QT_QPA_PLATFORM_PLUGIN_PATH="$PWD/$out/plugins/platforms"
          # With no game folder configured it stops at its own first-run setup
          # dialog and waits there, so it is started, read and closed. What is
          # being checked is that the binary loads and WorldEd's own code runs:
          # a whole compile needs the artwork out of a copy of the game, which
          # is not here and is never redistributed.
          set +e
          timeout 60 "./$out/PZWorldEd_cli" --generate-map=/nonexistent.pzw > run.log 2>&1
          code=$?
          set -e
          cat run.log
          echo "exit $code"
          [ "$code" != 127 ] || { echo "it never loaded"; exit 1; }
          [ "$code" -lt 128 ] || { echo "killed by a signal - it did not start cleanly"; exit 1; }
          grep -q 'Runtime: Qt' run.log ||
            { echo "it never reached its own startup"; exit 1; }
          grep -q 'Application Build' run.log ||
            { echo "no build banner - this is not WorldEd running"; exit 1; }
          echo "ok: the native build loads and runs WorldEd's own code"

      - name: It finds the tools folder from bin/, the way the Windows one does
        run: |
          # Setup unpacks this into PZMappingTools/bin, beside where the
          # Windows build goes, because WorldEd takes the folder ABOVE bin as
          # its installation root - that is where config/, Tiles/ and
          # settings/ live. On Windows the log says so plainly:
          #   Installation root <tools>/PZMappingTools
          # for an exe at <tools>/PZMappingTools/bin/PZWorldEd_cli.exe. If the
          # Linux build resolved it to bin/ instead it would find no artwork
          # and no configuration, and every compile would fail - so it is
          # checked here rather than on somebody's PC.
          rm -rf fake && mkdir -p fake/PZMappingTools/bin fake/PZMappingTools/config
          cp -a pack/PZWorldEd_cli-linux-x86_64/. fake/PZMappingTools/bin/
          root=$(cd fake/PZMappingTools && pwd)
          export QT_QPA_PLATFORM=offscreen
          export QT_QPA_PLATFORM_PLUGIN_PATH="$root/bin/plugins/platforms"
          set +e
          timeout 60 "$root/bin/PZWorldEd_cli" --generate-map=/nonexistent.pzw > root.log 2>&1
          set -e
          grep -E 'Installation root|Application configuration' root.log || true
          said=$(grep -m1 'Installation root' root.log | sed 's/.*Installation root //')
          [ -n "$said" ] || { echo "it never said where its installation root is"; exit 1; }
          [ "$said" = "$root" ] ||
            { echo "it took $said as its root, not $root - Setup is putting it in the wrong place";
              exit 1; }
          echo "ok: from bin/ it resolves the tools folder above, like the Windows build"

      - name: Its source, and the licences it has to carry
        run: |
          out=pack/PZWorldEd_cli-linux-x86_64
          # GPL-2.0 section 3: a modified program may be passed on as a binary
          # only with its complete corresponding source, from the same place.
          # A link to upstream is not that - upstream can move or vanish - so
          # the patched tree travels with it (worlded/make_release.py says the
          # same for the Windows build).
          # Beside the binary on the release page rather than inside it:
          # the source is most of the weight and nobody running a map needs
          # to download it (the Windows release is laid out the same way).
          rm -rf src/.git
          mkdir -p srcpack
          cp -r src srcpack/PZ_Mapping_Tools
          cp KnoxMap/worlded/patch_worlded_cli.py KnoxMap/worlded/patch_worlded_linux.py srcpack/
          cp .github/workflows/worlded-linux.yml srcpack/how-it-was-built.yml
          (cd srcpack && zip -qr ../pack/PZWorldEd_cli-linux-source.zip .)
          cp src/COPYING "$out/LICENSE-GPL-2.0.txt" 2>/dev/null ||
            cp src/licenses/GPL-2.0.txt "$out/LICENSE-GPL-2.0.txt"
          # Unlike the Windows build, this one carries Qt with it, and Qt is
          # LGPL-3. It is carried as separate shared libraries that anyone can
          # replace with their own, which is what the LGPL asks for.
          cp /usr/share/common-licenses/LGPL-3 "$out/LICENSE-LGPL-3.0.txt"
          qtver=$(dpkg-query -W -f='${Version}' libqt5core5a)
          cat > "$out/README-RELEASE.txt" <<EOF
          PZWorldEd_cli for Linux - built ${COMMIT}

          A build of PZWorldEd from PZ Mapping Tools
          (https://github.com/Unjammer/PZ_Mapping_Tools) at commit ${COMMIT},
          with two patches by KnoxMap (https://github.com/spytheeuclidean-a11y/knoxmap):

            patch_worlded_cli.py    adds --generate-map and --cells, so a map
                                    can be compiled without anyone clicking
                                    through WorldEd's File menu
            patch_worlded_linux.py  names the container in QPolygonF's braced
                                    initialiser, which GCC will not accept as
                                    it stands

          KnoxMap uses it so that making a map on Linux does not need Wine.

          LICENCE
          PZ Mapping Tools is GPL-2.0-or-later (LICENSE-GPL-2.0.txt), so this
          build is too. Its complete corresponding source is on the same
          release page, as PZWorldEd_cli-linux-source.zip: the whole tree with
          the patches already applied, the patch scripts, and
          how-it-was-built.yml, which is the exact recipe.

          lib/ carries Qt ${qtver} from Ubuntu 22.04, which is LGPL-3.0
          (LICENSE-LGPL-3.0.txt), as separate shared libraries you are free to
          replace with your own build. Qt's own source is

            apt-get source qtbase-opensource-src

          on Ubuntu 22.04, or https://download.qt.io/archive/qt/5.15/ .
          Ask at https://github.com/spytheeuclidean-a11y/knoxmap/issues and
          any of it will be sent to you.

          RUNNING IT
          It needs a platform plugin, which is in plugins/platforms:

            QT_QPA_PLATFORM=offscreen \
            QT_QPA_PLATFORM_PLUGIN_PATH=\$PWD/plugins/platforms \
              ./PZWorldEd_cli --generate-map=/path/to/project.pzw

          KnoxMap sets both for you.
          EOF
          sed -i 's/^          //' "$out/README-RELEASE.txt"
          du -sh "$out"

      - name: Tarball
        run: |
          # Starting it above left its settings and a log behind. Nobody
          # should be shipped a runner's config.
          rm -rf pack/PZWorldEd_cli-linux-x86_64/settings                  pack/PZWorldEd_cli-linux-x86_64/README.txt
          cd pack
          tar czf PZWorldEd_cli-linux-x86_64.tar.gz PZWorldEd_cli-linux-x86_64
          sha256sum PZWorldEd_cli-linux-x86_64.tar.gz PZWorldEd_cli-linux-source.zip | tee SHA256
          ls -lh *.tar.gz *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PZWorldEd_cli-linux-x86_64
          path: |
            pack/PZWorldEd_cli-linux-x86_64.tar.gz
            pack/PZWorldEd_cli-linux-source.zip
            pack/SHA256
          if-no-files-found: error

  publish:
    name: Publish it as a release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PZWorldEd_cli-linux-x86_64

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(grep 'tar.gz' SHA256 | cut -d' ' -f1)
          # Never "latest": that is what the in-app updater asks GitHub for,
          # and what every download link points at. A compiler release taking
          # it sends players to a 30 MB tarball of Qt instead of to KnoxMap.
          gh release create "${{ inputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --latest=false \
            --title "PZWorldEd_cli for Linux (${{ inputs.tag }})" \
            --notes "A native Linux build of the patched map compiler, so
          KnoxMap does not need Wine to make a map.

          Built from PZ Mapping Tools at \`4e86b80c505b3d77a2fb5f5675b752da966306f6\`
          with KnoxMap's \`patch_worlded_cli.py\` and \`patch_worlded_linux.py\`,
          against Qt 5.15 on Ubuntu 22.04. The complete corresponding source is
          the zip beside this, and the licences are inside the tarball.

          SHA-256 of the tarball: \`$sha\`

          Setup installs this for you; there is nothing to download by hand." \
            PZWorldEd_cli-linux-x86_64.tar.gz PZWorldEd_cli-linux-source.zip || true
          # Whether the release was new or already there, make sure both are on
          # it: the GPL wants the source from the same place as the binary.
          gh release upload "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --clobber PZWorldEd_cli-linux-x86_64.tar.gz \
            PZWorldEd_cli-linux-source.zip
          echo "sha256=$sha"

  setup_installs_it:
    name: Setup installs it, and it runs from where Setup put it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -q requests

      - name: Setup fetches the published compiler
        run: |
          python - <<'PY'
          import sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "KnoxMap")
          import knoxmap_setup

          # The real thing: the pinned URL, the pinned fingerprint, and the
          # unpacking that a Linux player's Setup does.
          tools = Path(tempfile.mkdtemp()) / "PZMappingTools"
          tools.mkdir(parents=True)
          ok = knoxmap_setup._install_linux_cli(tools)
          if not ok:
              raise SystemExit("Setup could not install the Linux compiler")
          exe = tools / "bin" / "PZWorldEd_cli"
          for wanted in (exe, tools / "bin" / "lib", tools / "bin" / "plugins" / "platforms"):
              if not wanted.exists():
                  raise SystemExit(f"{wanted} is missing from what Setup unpacked")
          import os, stat
          if not os.access(exe, os.X_OK):
              raise SystemExit(f"{exe} is not executable")
          print(f"TOOLS={tools}")
          Path("tools-path.txt").write_text(str(tools))
          PY

      - name: KnoxMap finds it, and calls it native
        run: |
          tools=$(cat tools-path.txt)
          PZMAPPING_TOOLS="$tools" python - "$tools" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "KnoxMap")
          import knoxpaths

          tools = Path(sys.argv[1])
          cli = tools / "bin" / "PZWorldEd_cli"
          if knoxpaths.through_wine(cli):
              raise SystemExit("KnoxMap thinks the native build needs Wine")
          if knoxpaths.command_for(cli) != [str(cli)]:
              raise SystemExit(f"KnoxMap would not run it directly: {knoxpaths.command_for(cli)}")
          env = knoxpaths.tool_env(cli)
          if env.get("QT_QPA_PLATFORM") != "offscreen":
              raise SystemExit("it would not be run headless")
          if not env.get("QT_QPA_PLATFORM_PLUGIN_PATH", "").endswith("plugins/platforms"):
              raise SystemExit(f"wrong plugin path: {env.get('QT_QPA_PLATFORM_PLUGIN_PATH')}")
          here = "/home/runner/maps/town"
          if knoxpaths.tool_path(here) != here:
              raise SystemExit("it would still hand the tools a Wine path")
          print("ok: run directly, headless, with real paths")
          PY

      - name: And it starts from there
        run: |
          tools=$(cat tools-path.txt)
          export QT_QPA_PLATFORM=offscreen
          export QT_QPA_PLATFORM_PLUGIN_PATH="$tools/bin/plugins/platforms"
          set +e
          timeout 60 "$tools/bin/PZWorldEd_cli" --generate-map=/nonexistent.pzw > run.log 2>&1
          set -e
          grep -E 'Installation root|Runtime: Qt' run.log || true
          grep -q "Installation root $tools\$" run.log ||
            { echo "wrong installation root"; exit 1; }
          echo "ok: installed by Setup on a machine with no Qt and no Wine, and it runs"
