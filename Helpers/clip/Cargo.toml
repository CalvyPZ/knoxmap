[package]
name = "knox_clip"
version = "0.1.0"
edition = "2021"
# The oldest toolchain this builds with. Nothing here needs a newer one, so a
# packager on an older rustup still produces the library.
rust-version = "1.70"
license = "MIT"
publish = false

[lib]
# Linked into Helpers' helper.dll (libhelper.so, libhelper.dylib). The calls
# Python uses are exported from that library, not from a second one.
name = "knox_clip"
crate-type = ["rlib"]

# No crates.io dependencies, on purpose. Classification comes from knox_ways,
# which is the same rule. The release packager builds this offline.
[dependencies]
knox_ways = { path = "../ways" }
