[workspace]
resolver = "2"
members = [".", "buildings", "terrain", "ways", "clip"]

[package]
name = "helper"
version = "0.1.0"
edition = "2021"
# The oldest toolchain this builds with. Nothing here needs a newer one, so a
# packager on an older rustup still produces the library.
rust-version = "1.70"
license = "MIT"
publish = false

[lib]
# One shared library for the crates: helper.dll on Windows, libhelper.so on
# Linux, libhelper.dylib on macOS. Python loads it from knoxbuild/native.py,
# generator/terrain_native.py, generator/ways_native.py, and
# generator/clip_native.py. The crates stay separate; this package only
# exports their calls, because a shared library publishes symbols that are
# defined in the library crate itself.
name = "helper"
crate-type = ["cdylib"]

[dependencies]
knox_buildings = { path = "buildings" }
knox_terrain = { path = "terrain" }
knox_ways = { path = "ways" }
knox_clip = { path = "clip" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Not "abort". A panic in one building or one piece of ground must be caught
# at that crate's boundary and reported as that job failing; it must never
# take the host program down.
panic = "unwind"
strip = "debuginfo"
