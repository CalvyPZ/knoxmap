[package]
name = "knox_terrain"
version = "0.1.0"
edition = "2021"
# The oldest toolchain this builds with. Nothing here needs a newer one, so a
# packager on an older rustup still produces the library.
rust-version = "1.70"
license = "MIT"
publish = false

[lib]
# Linked into Helpers' helper.dll (libhelper.so, libhelper.dylib). The calls
# Python uses are exported from that library, not from a second one.
name = "knox_terrain"
crate-type = ["rlib"]

# No dependencies, on purpose: the release packager has to build this offline on
# whatever machine it runs on. Threads, atomics and files are all in the
# standard library, and the deflate the PNGs need is written here rather than
# taken from crates.io.
[dependencies]
